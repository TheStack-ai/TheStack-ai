<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="880" height="50" role="img"><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.a{opacity:0;animation:fi .5s ease-out forwards}
.g{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:gr .7s cubic-bezier(.2,.8,.2,1) forwards}
.c{animation:bl 1.1s steps(1) infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fi{to{opacity:1}}
@keyframes gr{to{transform:scaleY(1)}}
@keyframes bl{50%{opacity:0}}
@keyframes pu{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.a,.g,.c,.p{animation:none;opacity:1;transform:none}}
</style><rect x=".5" y=".5" width="879" height="39" rx="10" fill="#0b0d14" stroke="#232838"/><text x="20" y="25" font-size="13" class="a" style="animation-delay:0.1s"><tspan fill="#4ade80">thestack@github</tspan><tspan fill="#4d5570"> ~ </tspan><tspan fill="#a78bfa">$ </tspan><tspan fill="#e6e8f0">tokscale --me</tspan></text></svg>
